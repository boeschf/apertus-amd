# PREPARATION ONLY. Require separate --time 00:05:00 --reservation cscs approval.
# Canonical projection forward only; not measured training layout or gradient acceptance.
# Consumer source e242f3c3c1136aeae498529bfde5e06bda9a7cca, TE130099ce4.
nodes = 1

[image]
store = "apertus-amd-images"
sha256 = "910bfcf936d3f7a1dfd17dc560481cfeff6c5d9a7f5619c14f43b17348a28490"

[environment]
OMP_NUM_THREADS = "1"
MAX_JOBS = "2"
NCCL_P2P_DISABLE = "1"
TE_HIPBLASLT_ALGO_SELECTION = "0"
TE_HIPBLASLT_TUNING_RUN_COUNT = "0"
TE_HIPBLASLT_LOG_TUNING = "1"
NVTE_LOG_GEMM_CONFIG = "1"

[procedure]
kind = "commands"
timeout = 180
validation = "../validation/kda_projection_forward_probe.py"
commands = [["python3", "-u", "/apertus/validation.py", "run", "--native-provenance", "pinned-image-build-provenance"]]
