# Same startup inputs as 760023; stop before any source materialization or training.
nodes = 16
entrypoint = "pretrain_gpt.py"
prepare = [["make", "-C", "megatron/core/datasets"]]

[source]
repository = "git@github.com:boeschf/Megatron-LM-MoE.git"
commit = "4b21bb5781ee6db66952a9b6ab128b688c7dc1d1"
excluded_submodules = ["_research"]

[image]
store = "apertus-amd-images"
sha256 = "910bfcf936d3f7a1dfd17dc560481cfeff6c5d9a7f5619c14f43b17348a28490"

[environment]
KDA_ALOG_PER_CHANNEL = "0"
KDA_USE_GATE_IN_KERNEL = "1"
KDA_FUSED_GATE = "1"
KDA_QK_L2NORM_IN_KERNEL = "1"
KDA_CONV1D_CUDA = "1"
KDA_FUSED_LOW_RANK_GATHER = "1"
TORCH_COMPILE_DISABLE = "0"
TORCH_NCCL_ASYNC_ERROR_HANDLING = "1"
TORCH_CPP_LOG_LEVEL = "WARNING"
OMP_NUM_THREADS = "18"
NUMEXPR_NUM_THREADS = "18"
NUMEXPR_MAX_THREADS = "512"
TOKENIZERS_PARALLELISM = "false"
MAX_JOBS = "8"
TORCHINDUCTOR_COMPILE_THREADS = "4"
NCCL_DEBUG = "INFO"
NCCL_P2P_DISABLE = "0"
OFI_NCCL_PROTOCOL = "SENDRECV"
NCCL_CROSS_NIC = "0"
NCCL_PXN_DISABLE = "1"
NCCL_NET_GDR_LEVEL = "PHB"
NCCL_NET_FORCE_FLUSH = "1"
HSA_ENABLE_IPC_MODE_LEGACY = "1"
NCCL_P2P_LEVEL = "SYS"
UCCL_EP_TRANSPORT = "cxi"
UCCL_SOCKET_IFNAME = "hsn"
UCCL_CXI_THREADING = "safe"
PYTORCH_HIP_ALLOC_CONF = "expandable_segments:True"
BEVERIN_COMM_WARMUP = "1"
BEVERIN_COMM_WARMUP_PARTS = "ar,p2p,a2a"
NCCL_RUNTIME_CONNECT = "0"
SS_BALLAST_GB = "0"
APERTUS_COMPILE_TRACE = "1"
TORCH_LOGS = "recompiles,graph_breaks"
NVTE_FLASH_ATTN = "1"
NVTE_FUSED_ATTN = "1"
NVTE_UNFUSED_ATTN = "1"

[procedure]
kind = "probe"
startup_only = true
# Required by the probe schema; no child is launched in startup-only mode.
timeout = 2700
validation = "../validation/chonk_fnuz_oom.py"
launch_blocked = "One-shot GPU startup-only diagnostic submitted as job 760046; no further launch is authorized."
