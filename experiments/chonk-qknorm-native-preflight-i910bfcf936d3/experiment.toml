# One-device import, ABI and native route smoke; no training or timing.
nodes = 1

[image]
store = "apertus-amd-images"
sha256 = "910bfcf936d3f7a1dfd17dc560481cfeff6c5d9a7f5619c14f43b17348a28490"

[environment]
BASH_ENV = ""
ENV = ""
LD_PRELOAD = ""
LD_AUDIT = ""

[procedure]
kind = "commands"
timeout = 450
validation = "../validation/chonk_qknorm_native_preflight.py"
commands = [
    ["/usr/bin/python3", "-u", "/apertus/validation.py"],
]
