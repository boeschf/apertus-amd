# One isolated FC1-forward component. No training or automatic retry.
nodes = 1

[image]
store = "apertus-amd-images"
sha256 = "910bfcf936d3f7a1dfd17dc560481cfeff6c5d9a7f5619c14f43b17348a28490"

[environment]
OMP_NUM_THREADS = "1"
TORCH_COMPILE_DISABLE = "0"
NVTE_USE_ROCM = "1"
NVTE_USE_CAST_TRANSPOSE_TRITON = "1"
NVTE_USE_HIPBLASLT = "1"
NVTE_USE_GROUPED_GEMM_TRITON = "0"
NVTE_GROUPED_LINEAR_SINGLE_PARAM = "0"
PRIMUS_TURBO_FRAMEWORK = "PYTORCH"
PRIMUS_TURBO_GROUPED_GEMM_BACKEND = "CK"
PRIMUS_TURBO_AUTO_TUNE = "0"

[procedure]
kind = "commands"
timeout = 300
validation = "../validation/chonk_turbo_ck_launch.py"
commands = [
    ["/opt/venv/bin/python3", "-I", "-B", "-u", "/apertus/validation.py"],
]
