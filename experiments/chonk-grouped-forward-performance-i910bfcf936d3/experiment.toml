# CPU/source-reviewed component; no GPU correctness or performance result yet.
# A future launch requires separate frozen-input and fresh-placement approval.
nodes = 1

[image]
store = "apertus-amd-images"
sha256 = "910bfcf936d3f7a1dfd17dc560481cfeff6c5d9a7f5619c14f43b17348a28490"

[environment]
OMP_NUM_THREADS = "1"
MAX_JOBS = "2"
NCCL_P2P_DISABLE = "1"

[procedure]
kind = "commands"
timeout = 510
validation = "../validation/chonk_grouped_forward_performance.py"
commands = [["python3", "-u", "/apertus/validation.py", "run"]]
