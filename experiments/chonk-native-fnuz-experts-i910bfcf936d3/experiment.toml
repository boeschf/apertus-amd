# gfx942 native expert component: six operations, actual widths, no training or checkpoint.
nodes = 1
entrypoint = "tests/test_utils/python_scripts/qualify_resident_fnuz_experts.py"
args = ["--trace-dir", "/apertus/output/expert-traces"]

[source]
repository = "git@github.com:boeschf/Megatron-LM-MoE.git"
commit = "37a8e6fdca240ca4e582d1d7191e8fdc30577384"
excluded_submodules = ["_research"]

[image]
store = "apertus-amd-images"
sha256 = "910bfcf936d3f7a1dfd17dc560481cfeff6c5d9a7f5619c14f43b17348a28490"

[environment]
OMP_NUM_THREADS = "4"
TORCH_CPP_LOG_LEVEL = "WARNING"

[procedure]
kind = "probe"
timeout = 600
