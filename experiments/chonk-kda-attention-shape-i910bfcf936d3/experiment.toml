# PREPARATION ONLY; rank0 startup and separate allocation approval remain prerequisites.
nodes = 1

[image]
store = "apertus-amd-images"
sha256 = "910bfcf936d3f7a1dfd17dc560481cfeff6c5d9a7f5619c14f43b17348a28490"

[environment]
OMP_NUM_THREADS = "1"
MAX_JOBS = "16"
NCCL_P2P_DISABLE = "1"
# Match the explicit workload admission choices, not a forced selected backend.
NVTE_FLASH_ATTN = "1"
NVTE_FUSED_ATTN = "1"
NVTE_UNFUSED_ATTN = "1"

[procedure]
kind = "commands"
timeout = 720
validation = "../validation/kda_attention_shape_probe.py"
commands = [["python3", "-u", "/apertus/validation.py", "run"]]
