# Full Mid-4B geometry; initial 26-update mock-data training run.
# Default: 16 nodes (64 GPUs); TP1/PP2/CP1/EP8/ETP1, DP32.
# Four nodes is the minimum rank count for this parallel layout.
nodes = 16
entrypoint = "pretrain_gpt.py"
prepare = [["make", "-C", "megatron/core/datasets"]]
args = [
  # Model dimensions and normalization.
  "--num-layers", "32", "--hidden-size", "2560", "--ffn-hidden-size", "12960",
  "--num-attention-heads", "20", "--group-query-attention", "--num-query-groups", "10",
  "--normalization", "RMSNorm", "--qk-layernorm", "--sandwich-norm",
  "--residual-output-scaling", "--scale-embeddings-by-sqrt-hidden",
  "--untie-embeddings-and-output-weights", "--disable-bias-linear", "--sssglu",
  "--position-embedding-type", "rope", "--rotary-base", "10000", "--no-rope-freq", "1",
  "--seq-length", "8192", "--max-position-embeddings", "8192",
  "--vocab-size", "200063", "--make-vocab-size-divisible-by", "128",
  "--attention-dropout", "0", "--hidden-dropout", "0", "--init-method-std", "0.0197642",

  # Three KDA layers followed by one global-attention layer, repeated eight times.
  "--enable-experimental", "--experimental-attention-variant", "kda",
  "--linear-attention-freq", "([1,1,1,0]*8)",
  "--linear-attention-safe-output-gate", "--attention-output-gate",
  "--linear-conv-kernel-dim", "4", "--linear-key-head-dim", "128",
  "--linear-value-head-dim", "128", "--linear-num-key-heads", "20", "--linear-num-value-heads", "20",
  "--transformer-impl", "transformer_engine", "--attention-backend", "auto",

  # First layer dense, remaining 31 layers MoE; native TE experts and all-to-all.
  "--num-experts", "256", "--moe-router-topk", "8", "--moe-layer-freq", "([0]+[1]*31)",
  "--moe-ffn-hidden-size", "1440", "--moe-latent-size", "1280",
  "--moe-shared-expert-intermediate-size", "1440", "--moe-grouped-gemm", "--moe-permute-fusion",
  "--moe-token-dispatcher-type", "alltoall", "--moe-router-score-function", "sigmoid",
  "--moe-router-dtype", "fp32", "--moe-router-topk-scaling-factor", "2.5",
  "--moe-router-load-balancing-type", "quantile_balancing", "seq_aux_loss",
  "--moe-aux-loss-coeff", "0.0", "1e-4",

  # Parallel layout and global batch: 36 microbatches per update on 16 nodes.
  "--tensor-model-parallel-size", "1", "--pipeline-model-parallel-size", "2",
  "--context-parallel-size", "1", "--expert-model-parallel-size", "8", "--expert-tensor-parallel-size", "1",
  "--micro-batch-size", "1", "--global-batch-size", "1152", "--bf16", "--main-grads-dtype", "fp32",

  # SwissAI magnitude/direction-decoupled optimizer and Mid-4B learning-rate schedule.
  "--optimizer", "md_decoupling", "--use-layer-wise-distributed-optimizer", "--weight-decay", "0",
  "--use-orthogonal-updates", "--muon-coefficient-type", "polar_express",
  "--muon-scale-mode", "shape_up", "--muon-router-scale-mode", "none",
  "--muon-momentum", "0.95", "--muon-use-nesterov",
  "--hypersphere-mode", "row", "--hypersphere-embedding-mode", "row", "--hypersphere-router-mode", "row",
  "--hypersphere-radius-mode", "fan_in", "--md-router-use-orthogonal-updates", "True",
  "--hypersphere-gains-mode", "rowcol", "--hypersphere-gains-mode-router", "rowcol",
  "--hypersphere-gains-mode-embedding", "none", "--gain-parametrization", "softplus",
  "--lr", "0.00426", "--min-lr", "0.0001", "--matrix-lr", "0.0213", "--gains-lr", "0.00426",
  "--lr-decay-style", "linear", "--lr-warmup-iters", "718", "--lr-decay-iters", "71829",
  "--min-lr-mode", "absolute", "--adam-beta1", "0.9", "--adam-beta2", "0.95", "--clip-grad", "1",

  # Bounded initial run; selective recomputation, no gradient-reduction overlap.
  # Apex gradient accumulation fusion is disabled for this initial ROCm baseline.
  "--recompute-granularity", "selective", "--recompute-modules", "moe_act", "layernorm",
  "--no-gradient-accumulation-fusion", "--cross-entropy-loss-fusion", "--cross-entropy-fusion-impl", "te",
  "--train-iters", "26", "--seed", "1234", "--save-interval", "26", "--ckpt-format", "torch",
  "--mock-data", "--tokenizer-type", "NullTokenizer", "--split", "100,0,0", "--num-workers", "0",
  "--no-create-attention-mask-in-dataloader", "--eval-iters", "0", "--eval-interval", "100000",
  "--log-interval", "1", "--log-throughput", "--distributed-timeout-minutes", "20",
  "--manual-gc", "--manual-gc-interval", "100",
]

[source]
repository = "https://github.com/swiss-ai/Megatron-LM-MoE.git"
commit = "c56351143a8e15899ef3d7d7f97867772f8e0e5c"
excluded_submodules = ["_research"]

[image]
store = "apertus-amd-images"
sha256 = "e84d7ba62309f91946d3c070772bb633002d6eb8b8ec4dd32d358601520778fe"

[environment]
NCCL_DEBUG = "INFO"
NVTE_FLASH_ATTN = "1"
NVTE_FUSED_ATTN = "1"
NVTE_UNFUSED_ATTN = "1"
# This changes KDA parameter geometry and is therefore an explicit model input.
KDA_ALOG_PER_CHANNEL = "1"
# Temporary opt-out for the automatic reference hook in this published image.
B2_AUTOTUNE_SKIP = "0"

[procedure]
kind = "train"
