# Two independent builds on local rank zero with all four MI300As visible.
nodes = 1

[image]
store = "apertus-amd-images"
sha256 = "910bfcf936d3f7a1dfd17dc560481cfeff6c5d9a7f5619c14f43b17348a28490"

[environment]
OMP_NUM_THREADS = "18"
MAX_JOBS = "8"
NVTE_FLASH_ATTN = "1"
NVTE_FUSED_ATTN = "1"
NVTE_UNFUSED_ATTN = "1"

[procedure]
kind = "commands"
timeout = 1200
validation = "../validation/chonk_ck_attention_bwd_reuse.py"
commands = [["python3", "-u", "/apertus/validation.py", "compare"]]
launch_blocked = "One-shot independent CK build comparison submitted as job 762221; no further launch is authorized."
