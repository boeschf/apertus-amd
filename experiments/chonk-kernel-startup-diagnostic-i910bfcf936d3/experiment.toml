nodes = 1

[image]
store = "apertus-amd-images"
sha256 = "910bfcf936d3f7a1dfd17dc560481cfeff6c5d9a7f5619c14f43b17348a28490"

[procedure]
kind = "commands"
timeout = 120
validation = "../validation/kernel_startup_diagnostic.py"
commands = [["python3", "-u", "/apertus/validation.py", "inventory"]]
