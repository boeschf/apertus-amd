# Preparation only: distinct eight-worker cold-JIT attention check, original numerical policy/bounds.
# Separate parent launch approval requires protected-node transport and nid002458 fresh verification.
nodes = 1

[image]
store = "apertus-amd-images"
sha256 = "910bfcf936d3f7a1dfd17dc560481cfeff6c5d9a7f5619c14f43b17348a28490"

[environment]
OMP_NUM_THREADS = "1"
MAX_JOBS = "8"
AITER_LOG_MORE = "1"
NCCL_P2P_DISABLE = "1"

[procedure]
kind = "commands"
timeout = 720
validation = "../validation/combined_image_attention_parallel.py"
commands = [["python3", "-u", "/apertus/validation.py"]]
