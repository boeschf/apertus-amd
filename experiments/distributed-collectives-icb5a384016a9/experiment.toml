# Exact ROCm base CI commands from alps-extended-images, commit
# 515652bae920b49243c8652c9a498a647a7ec628, ci-pipelines/child-templates.yaml.
# Run against the Primus 26.8 Apertus application image, with four GPUs per node.
nodes = 2
[image]
store = "apertus-amd-images"
sha256 = "cb5a384016a99328a970d823ecf264a45e43b23b41e8e0c73e2baf14c33e77c0"

[environment]
NCCL_DEBUG = "INFO"
FI_LOG_LEVEL = "warn"

[procedure]
kind = "commands"
timeout = 180
commands = [
  ["all_reduce_perf", "-b", "32", "-e", "4M", "-f", "2", "-g", "1"],
  ["/usr/local/libexec/osu-micro-benchmarks/mpi/collective/osu_alltoall", "--type", "mpi_float", "--message-size", "32:2^22:2", "--full", "--tail-lat", "--accelerator", "rocm"],
]
