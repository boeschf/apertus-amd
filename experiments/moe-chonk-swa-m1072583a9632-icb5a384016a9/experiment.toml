# Historical SWA Chonk workload from reference 677561, on our pinned source/image.
# Historical --hypersphere-radius-from-init is now --hypersphere-radius-mode init.
nodes = 16
entrypoint = "pretrain_gpt.py"
prepare = [["make", "-C", "megatron/core/datasets"]]
args = [
  "--num-layers", "42", "--pipeline-model-parallel-layout", "Ettt|tttttt|tttttt|ttttt|tttttt|tttttt|tttttt|ttttL",
  "--hidden-size", "3584", "--ffn-hidden-size", "8960", "--num-attention-heads", "32",
  "--group-query-attention", "--num-query-groups", "8", "--kv-channels", "112",
  "--normalization", "RMSNorm", "--norm-epsilon", "1e-5", "--qk-layernorm", "--sandwich-norm",
  "--residual-output-scaling", "--scale-embeddings-by-sqrt-hidden",
  "--untie-embeddings-and-output-weights", "--disable-bias-linear", "--sssglu",
  "--init-method-std", "0.0167038", "--attention-dropout", "0", "--hidden-dropout", "0",
  "--position-embedding-type", "rope", "--rotary-base", "10000", "--window-size", "512,0",
  "--window-attn-skip-freq", "([1,1,1,1,1,0]*7)", "--no-rope-freq", "([0,0,0,0,0,1]*7)",
  "--attention-backend", "fused", "--transformer-impl", "transformer_engine",
  "--num-experts", "256", "--moe-router-topk", "8", "--moe-ffn-hidden-size", "2048",
  "--moe-latent-size", "1792", "--moe-shared-expert-intermediate-size", "2048",
  "--moe-layer-freq", "[0,0,1,0]+[1]*38", "--moe-grouped-gemm", "--moe-permute-fusion",
  "--moe-token-dispatcher-type", "alltoall", "--moe-router-score-function", "sigmoid",
  "--moe-router-topk-scaling-factor", "2.5", "--moe-router-dtype", "fp32",
  "--moe-router-load-balancing-type", "quantile_balancing",
  "--moe-router-quantile-balancing-method", "legacy_average",
  "--moe-router-quantile-balancing-ema", "0", "--moe-aux-loss-coeff", "0.001",
  "--tensor-model-parallel-size", "1", "--pipeline-model-parallel-size", "4",
  "--context-parallel-size", "1", "--expert-model-parallel-size", "16", "--expert-tensor-parallel-size", "1",
  "--micro-batch-size", "1", "--global-batch-size", "256", "--seq-length", "8192",
  "--max-position-embeddings", "8192", "--train-iters", "26",
  "--bf16", "--main-params-dtype", "fp32", "--main-grads-dtype", "fp32", "--accumulate-allreduce-grads-in-fp32",
  "--recompute-granularity", "selective", "--recompute-modules", "layernorm", "moe",
  "--manual-gc", "--manual-gc-interval", "100",
  "--optimizer", "md_decoupling", "--use-layer-wise-distributed-optimizer",
  "--matrix-lr", "1e-3", "--gains-lr", "1e-4", "--gain-parametrization", "direct", "--gains-no-clamp-min",
  "--muon-momentum", "0.95", "--muon-use-nesterov", "--muon-num-ns-steps", "5",
  "--muon-coefficient-type", "quintic", "--muon-scale-mode", "shape_up",
  "--muon-tp-mode", "blockwise", "--muon-scalar-optimizer", "adam", "--use-orthogonal-updates",
  "--md-router-use-orthogonal-updates", "true", "--hypersphere-mode", "flat",
  "--hypersphere-gains-mode", "rowcol", "--hypersphere-router-mode", "row", "--hypersphere-radius-mode", "init",
  "--lr", "1e-4", "--min-lr", "1e-4", "--lr-decay-style", "constant", "--lr-warmup-iters", "0",
  "--weight-decay", "0", "--clip-grad", "1.0", "--adam-beta1", "0.9", "--adam-beta2", "0.95", "--adam-eps", "1e-8",
  "--overlap-grad-reduce", "--no-overlap-p2p-communication", "--distributed-timeout-minutes", "30",
  "--log-interval", "1", "--log-throughput", "--eval-iters", "0", "--eval-interval", "100000", "--seed", "1234",
  "--mock-data", "--tokenizer-type", "NullTokenizer", "--vocab-size", "200063",
  "--timing-log-level", "0", "--timing-log-option", "minmax",
  "--save-interval", "26", "--ckpt-format", "torch", "--num-workers", "0",
]

[source]
repository = "git@github.com:boeschf/Megatron-LM-MoE.git"
commit = "1072583a9632fd1902544f7eaea562e2578ef1de"
excluded_submodules = ["_research"]

[image]
store = "apertus-amd-images"
sha256 = "cb5a384016a99328a970d823ecf264a45e43b23b41e8e0c73e2baf14c33e77c0"

[environment]
NCCL_DEBUG = "INFO"
NCCL_P2P_DISABLE = "1"
NVTE_FLASH_ATTN = "0"
NVTE_FUSED_ATTN = "1"
NVTE_UNFUSED_ATTN = "0"
BEVERIN_COMM_WARMUP = "1"
BEVERIN_COMM_WARMUP_PARTS = "ar,p2p,a2a"
NCCL_RUNTIME_CONNECT = "0"
SS_BALLAST_GB = "0"
PYTORCH_HIP_ALLOC_CONF = "expandable_segments:True"
TORCH_COMPILE_DISABLE = "1"

[procedure]
kind = "train"
validation = "../validation/memory_trace.py"
