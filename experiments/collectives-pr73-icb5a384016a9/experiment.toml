# PR #73 candidate: restore RCCL P2P with the complete relevant runtime settings.
# Use --nodes 1 for the intra-node arm; default two nodes exercises CXI as well.
nodes = 2

[image]
store = "apertus-amd-images"
sha256 = "cb5a384016a99328a970d823ecf264a45e43b23b41e8e0c73e2baf14c33e77c0"

[environment]
NCCL_DEBUG = "INFO"
NCCL_DEBUG_SUBSYS = "INIT,NET,GRAPH,P2P,ENV"
FI_LOG_LEVEL = "warn"
NCCL_P2P_DISABLE = "0"
OFI_NCCL_PROTOCOL = "SENDRECV"
NCCL_CROSS_NIC = "0"
NCCL_PXN_DISABLE = "1"
NCCL_NET_GDR_LEVEL = "PHB"
NCCL_NET_FORCE_FLUSH = "1"
HSA_ENABLE_IPC_MODE_LEGACY = "1"
NCCL_P2P_LEVEL = "SYS"
OMPI_MCA_memory = "^patcher"

[procedure]
kind = "commands"
timeout = 180
commands = [
  ["all_reduce_perf", "-b", "32", "-e", "64M", "-f", "2", "-g", "1", "-n", "20", "-w", "5", "-c", "1"],
  ["alltoall_perf", "-b", "32", "-e", "64M", "-f", "2", "-g", "1", "-n", "20", "-w", "5", "-c", "1"],
  ["alltoallv_perf", "-b", "32", "-e", "64M", "-f", "2", "-g", "1", "-n", "20", "-w", "5", "-c", "1"],
  ["sendrecv_perf", "-b", "32", "-e", "16M", "-f", "2", "-g", "1", "-n", "100", "-w", "10", "-c", "1"],
]
