# Actual Megatron autograd regression for the verified signed readiness fix.
nodes = 4
entrypoint = "tests/functional_tests/qualify_fnuz_dispatch.py"
args = ["ep16-ready-order"]

[source]
repository = "git@github.com:boeschf/Megatron-LM-MoE.git"
commit = "041c1d753028e4190efb342accb98a6f362ee7dd"
excluded_submodules = ["_research"]

[image]
store = "apertus-amd-images"
sha256 = "910bfcf936d3f7a1dfd17dc560481cfeff6c5d9a7f5619c14f43b17348a28490"

[environment]
OMP_NUM_THREADS = "18"
TORCH_NCCL_ASYNC_ERROR_HANDLING = "1"
TORCH_CPP_LOG_LEVEL = "WARNING"
NCCL_DEBUG = "INFO"
NCCL_P2P_DISABLE = "0"
OFI_NCCL_PROTOCOL = "SENDRECV"
NCCL_CROSS_NIC = "0"
NCCL_PXN_DISABLE = "1"
NCCL_NET_GDR_LEVEL = "PHB"
NCCL_NET_FORCE_FLUSH = "1"
HSA_ENABLE_IPC_MODE_LEGACY = "1"
NCCL_P2P_LEVEL = "SYS"
UCCL_EP_TRANSPORT = "cxi"
UCCL_SOCKET_IFNAME = "hsn"
UCCL_CXI_THREADING = "safe"
PYTORCH_HIP_ALLOC_CONF = "expandable_segments:True"
NCCL_RUNTIME_CONNECT = "0"
SS_BALLAST_GB = "0"

[procedure]
kind = "probe"
timeout = 900
launch_blocked = "One-shot signed Megatron EP16 readiness regression submitted as job 762600; no further launch is authorized."
