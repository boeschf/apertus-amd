# Four-node component: native cached BF16 dispatch waits for local materialization.
nodes = 4

[image]
store = "apertus-amd-images"
sha256 = "910bfcf936d3f7a1dfd17dc560481cfeff6c5d9a7f5619c14f43b17348a28490"

[environment]
OMP_NUM_THREADS = "18"
MAX_JOBS = "8"
TORCH_NCCL_ASYNC_ERROR_HANDLING = "1"
TORCH_CPP_LOG_LEVEL = "WARNING"
NCCL_DEBUG = "INFO"
NCCL_P2P_DISABLE = "0"
OFI_NCCL_PROTOCOL = "SENDRECV"
NCCL_CROSS_NIC = "0"
NCCL_PXN_DISABLE = "1"
NCCL_NET_GDR_LEVEL = "PHB"
NCCL_NET_FORCE_FLUSH = "1"
HSA_ENABLE_IPC_MODE_LEGACY = "1"
NCCL_P2P_LEVEL = "SYS"
UCCL_EP_TRANSPORT = "cxi"
UCCL_SOCKET_IFNAME = "hsn"
UCCL_CXI_THREADING = "safe"
PYTORCH_HIP_ALLOC_CONF = "expandable_segments:True"
NCCL_RUNTIME_CONNECT = "0"

[procedure]
kind = "commands"
timeout = 600
validation = "../validation/chonk_bf16_event_order.py"
commands = [["python3", "-u", "/apertus/validation.py", "ep16"]]
launch_blocked = "One-shot native EP16 BF16 event-order check submitted as job 762588; no further launch is authorized."
