# Isolated full-shape KDA backward comparison; not a full Chonk training run.
nodes = 1
entrypoint = "fla/ops/kda/chunk_bwd.py"
args = []

[source]
repository = "https://github.com/boeschf/flash-linear-attention.git"
commit = "6c70d55a71e7fb4fca7de990015f6a3046193762"

[image]
store = "apertus-amd-images"
sha256 = "910bfcf936d3f7a1dfd17dc560481cfeff6c5d9a7f5619c14f43b17348a28490"

[environment]
OMP_NUM_THREADS = "1"
MAX_JOBS = "1"
TORCHINDUCTOR_COMPILE_THREADS = "1"

[procedure]
kind = "probe"
timeout = 1500
gpu_identity_timeout = 600
startup_trace = true
validation = "../validation/kda_backward_release.py"
launch_blocked = "One-shot single-GPU KDA tensor-lifetime A/B submitted as job 765106; no further launch is authorized."
